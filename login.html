<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Admin Dashboard</title>
  <!-- Tailwind CSS v4 Play CDN -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4">

  <!-- Card Login -->
  <div class="bg-white w-full max-w-[440px] rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8 sm:p-10 transition-all duration-300 hover:shadow-2xl hover:shadow-slate-200/80">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-[#1E56E3] tracking-tight">Login</h1>
    </div>

    <form id="loginForm" class="space-y-6" onsubmit="handleLogin(event)">
      <!-- Input Email -->
      <div class="space-y-2">
        <label for="email" class="block text-sm font-semibold text-slate-700">Email</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="Masukkan email" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#1E56E3]/20 focus:border-[#1E56E3] transition-all text-sm text-slate-800 placeholder:text-slate-400 bg-slate-50/50 focus:bg-white"
        >
      </div>

      <!-- Input Password -->
      <div class="space-y-2">
        <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="Masukkan password" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#1E56E3]/20 focus:border-[#1E56E3] transition-all text-sm text-slate-800 placeholder:text-slate-400 bg-slate-50/50 focus:bg-white"
        >
      </div>

      <!-- Ingat Saya & Lupa Password -->
      <div class="flex items-center justify-between text-xs sm:text-sm">
        <div class="flex items-center gap-2">
          <input 
            type="checkbox" 
            id="remember" 
            class="w-4.5 h-4.5 rounded border-slate-300 text-[#1E56E3] focus:ring-[#1E56E3]"
          >
          <label for="remember" class="text-slate-600 cursor-pointer select-none font-medium">Ingat saya</label>
        </div>
        <a href="#" class="text-[#1E56E3] hover:text-[#1641A8] font-semibold transition-colors">Lupa password?</a>
      </div>

      <!-- Tombol Login -->
      <button 
        type="submit" 
        class="w-full bg-[#1E56E3] hover:bg-[#1641A8] active:bg-[#0F2E7E] text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/20 hover:shadow-xl hover:shadow-blue-500/30 transition-all cursor-pointer text-center flex items-center justify-center gap-2 group"
      >
        <span>Login</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </form>

    <!-- Footer Register -->
    <div class="mt-8 text-center text-sm text-slate-600">
      Belum punya akun? <a href="#" class="text-[#1E56E3] hover:text-[#1641A8] font-semibold transition-colors">Daftar</a>
    </div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Animasi login sukses tiruan sebelum berpindah halaman
      const button = event.target.querySelector('button[type="submit"]');
      button.disabled = true;
      button.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Memproses...</span>
      `;

      setTimeout(() => {
        window.location.href = 'admin.html';
      }, 800);
    }
  </script>
</body>
</html>
