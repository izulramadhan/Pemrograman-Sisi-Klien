<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Mahasiswa</title>
  <!-- Tailwind CSS v4 Play CDN -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-[#0B1E54] text-slate-300 transform -translate-x-full transition-transform duration-300 ease-in-out lg:translate-x-0 flex flex-col justify-between border-r border-[#132A6D]">
    <div>
      <!-- Sidebar Header -->
      <div class="h-16 flex items-center px-6 border-b border-[#132A6D]">
        <h1 class="text-xl font-bold text-white tracking-wider flex items-center gap-2">
          <span>Admin</span>
        </h1>
      </div>
      <!-- Sidebar Navigation -->
      <nav class="p-4 space-y-2">
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#132A6D] hover:text-white transition-all text-sm font-medium group">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-[#132A6D] text-white transition-all text-sm font-semibold shadow-inner">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0v6m-6-3h12" />
          </svg>
          <span>Mahasiswa</span>
        </a>
      </nav>
    </div>
    <!-- Sidebar Footer / Logout -->
    <div class="p-4 border-t border-[#132A6D]">
      <a href="login.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-red-950/30 hover:text-red-400 transition-all text-sm font-medium group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400 group-hover:text-red-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <!-- Mobile Sidebar Overlay -->
  <div id="sidebarOverlay" class="fixed inset-0 z-30 bg-black/40 hidden lg:hidden" onclick="toggleSidebar()"></div>

  <!-- Main Content Wrapper -->
  <div class="lg:pl-64 w-full flex flex-col min-h-screen">
    
    <!-- Top Header -->
    <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-20 shadow-sm shadow-slate-100/50">
      <div class="flex items-center gap-3">
        <!-- Sidebar Toggle Button (Mobile) -->
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition-all cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <span class="text-xl font-bold text-slate-800">Mahasiswa</span>
      </div>
      <!-- User Profile Dropdown Placeholder -->
      <div class="flex items-center gap-3">
        <div class="hidden sm:flex flex-col text-right">
          <span class="text-sm font-semibold text-slate-700">Administrator</span>
          <span class="text-xs text-slate-400">admin@dashboard.com</span>
        </div>
        <div class="w-10 h-10 rounded-full bg-slate-200 border border-slate-300 flex items-center justify-center font-bold text-slate-600 shadow-sm cursor-pointer hover:bg-slate-300 transition-all select-none">
          A
        </div>
      </div>
    </header>

    <!-- Main Content Body -->
    <main class="flex-grow p-6 space-y-6">
      
      <!-- Card Daftar Mahasiswa -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div>
            <h2 class="text-lg font-bold text-slate-800">Daftar Mahasiswa</h2>
            <p class="text-xs sm:text-sm text-slate-500">Kelola informasi data mahasiswa aktif</p>
          </div>
          <button 
            onclick="openAddModal()" 
            class="bg-[#0B1E54] hover:bg-[#132A6D] active:bg-[#071337] text-white font-semibold py-2.5 px-5 rounded-xl text-sm transition-all shadow-md shadow-blue-900/10 cursor-pointer flex items-center justify-center gap-2 self-start sm:self-auto group"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5 transform group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            <span>Tambah Mahasiswa</span>
          </button>
        </div>

        <!-- Table Container -->
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-[#0B1E54] text-white text-xs sm:text-sm font-semibold tracking-wider">
                <th class="py-4 px-6">NIM</th>
                <th class="py-4 px-6">Nama</th>
                <th class="py-4 px-6 text-center w-40">Aksi</th>
              </tr>
            </thead>
            <tbody id="studentTableBody" class="divide-y divide-slate-100 text-sm text-slate-700">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
      &copy; 2026 Admin Dashboard. All rights reserved.
    </footer>
  </div>

  <!-- Modal Form -->
  <div id="studentModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-100 transform scale-95 opacity-0 transition-all duration-300" id="modalCard">
      <!-- Modal Header -->
      <div class="flex items-center justify-between p-6 border-b border-slate-100">
        <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Tambah Mahasiswa</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors p-1 rounded-lg hover:bg-slate-100 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Body (Form) -->
      <form id="studentForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
        <!-- Hidden input for original NIM when editing -->
        <input type="hidden" id="editIndex" value="-1">
        
        <div class="space-y-1.5">
          <label for="nim" class="block text-sm font-semibold text-slate-700">NIM</label>
          <input 
            type="text" 
            id="nim" 
            required 
            placeholder="Masukkan NIM"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#1E56E3]/20 focus:border-[#1E56E3] transition-all text-sm bg-slate-50/50 focus:bg-white"
          >
        </div>

        <div class="space-y-1.5">
          <label for="nama" class="block text-sm font-semibold text-slate-700">Nama</label>
          <input 
            type="text" 
            id="nama" 
            required 
            placeholder="Masukkan nama"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#1E56E3]/20 focus:border-[#1E56E3] transition-all text-sm bg-slate-50/50 focus:bg-white"
          >
        </div>

        <!-- Modal Footer -->
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
          <button 
            type="button" 
            onclick="closeModal()" 
            class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 transition-all cursor-pointer"
          >
            Batal
          </button>
          <button 
            type="submit" 
            class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-[#1E56E3] hover:bg-[#1641A8] active:bg-[#0F2E7E] transition-all cursor-pointer shadow-md shadow-blue-500/10"
          >
            Simpan
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial Student Data
    let students = [
      { nim: '20211002', nama: 'Ahmad Fauzi' },
      { nim: '20211003', nama: 'Siti Aminah' },
      { nim: '20211004', nama: 'Budi Santoso' },
      { nim: '20211005', nama: 'Dewi Lestari' },
      { nim: '20211001', nama: 'Rian Hidayat' }
    ];

    // Load table content on load
    window.addEventListener('DOMContentLoaded', () => {
      renderTable();
    });

    // Render Table Function
    function renderTable() {
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';

      if (students.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="3" class="py-8 text-center text-slate-400">
              Tidak ada data mahasiswa. Klik "+ Tambah Mahasiswa" untuk menambahkan.
            </td>
          </tr>
        `;
        return;
      }

      students.forEach((student, index) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/80 transition-colors duration-150';
        tr.innerHTML = `
          <td class="py-4 px-6 font-medium text-slate-900">${student.nim}</td>
          <td class="py-4 px-6 font-medium text-slate-700">${student.nama}</td>
          <td class="py-4 px-6">
            <div class="flex items-center justify-center gap-2">
              <button 
                onclick="openEditModal(${index})" 
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-semibold text-xs transition-all shadow-sm shadow-amber-500/10 cursor-pointer"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
                <span>Edit</span>
              </button>
              <button 
                onclick="deleteStudent(${index})" 
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-semibold text-xs transition-all shadow-sm shadow-red-600/10 cursor-pointer"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                <span>Hapus</span>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Sidebar Mobile Toggle
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }

    // Modal Control Functions
    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Tambah Mahasiswa';
      document.getElementById('studentForm').reset();
      document.getElementById('editIndex').value = '-1';
      document.getElementById('nim').disabled = false; // Allow editing NIM on new entries
      
      const modal = document.getElementById('studentModal');
      const card = document.getElementById('modalCard');
      
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        card.classList.remove('scale-95', 'opacity-0');
      }, 50);
    }

    function openEditModal(index) {
      const student = students[index];
      document.getElementById('modalTitle').textContent = 'Tambah Mahasiswa'; // matching original title but editable context
      document.getElementById('nim').value = student.nim;
      document.getElementById('nama').value = student.nama;
      document.getElementById('editIndex').value = index;
      document.getElementById('nim').disabled = true; // Typically NIM is a primary key, keep disabled to avoid confusion
      
      const modal = document.getElementById('studentModal');
      const card = document.getElementById('modalCard');
      
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        card.classList.remove('scale-95', 'opacity-0');
      }, 50);
    }

    function closeModal() {
      const modal = document.getElementById('studentModal');
      const card = document.getElementById('modalCard');
      
      modal.classList.add('opacity-0');
      card.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    // Form Submit Handler
    function handleFormSubmit(event) {
      event.preventDefault();
      const nim = document.getElementById('nim').value.trim();
      const nama = document.getElementById('nama').value.trim();
      const editIndex = parseInt(document.getElementById('editIndex').value);

      if (!nim || !nama) return;

      if (editIndex === -1) {
        // Check for duplicate NIM
        if (students.some(s => s.nim === nim)) {
          alert('NIM sudah terdaftar!');
          return;
        }
        students.push({ nim, nama });
      } else {
        students[editIndex].nama = nama;
      }

      renderTable();
      closeModal();
    }

    // Delete Student Handler
    function deleteStudent(index) {
      if (confirm(`Apakah Anda yakin ingin menghapus mahasiswa ${students[index].nama} (${students[index].nim})?`)) {
        students.splice(index, 1);
        renderTable();
      }
    }
  </script>
</body>
</html>
